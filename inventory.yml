all:
  vars:
    k8s_version: 1.35
    ansible_ssh_private_key_file: ~/.ssh/vm-srvs_id
    ansible_user: mhand
    ansible_python_interpreter: /usr/bin/python3 # skips ansible annoying warnings/errors
    cilium_version: 1.20.0
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
  children:
    control_plane:
      hosts:
        control-plane-01:
          ansible_host: 172.16.167.11
    workers:
      hosts:
        worker-01:
          ansible_host: 172.16.167.101
        worker-02:
          ansible_host: 172.16.167.102
