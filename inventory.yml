all:
  vars:
    k8s_version: 1.34
    ansible_ssh_private_key_file: ~/.ssh/vm-srvs_id.pub
    ansible_user: mhand
    ansible_python_interpreter: /usr/bin/python3 # skips ansible annoying warnings/errors
  children:
    control_plane:
      hosts:
        control-plane-01:
          ansible_host: 172.16.167.10
    workers:
      hosts:
        worker-01:
          ansible_host: 172.16.167.101
        worker-02:
          ansible_host: 172.16.167.102
