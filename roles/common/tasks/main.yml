---
# -----------------------------------------------------------------------
# 1. System Preparation (Swap, Modules, Sysctl)
# -----------------------------------------------------------------------
- name: Disable SWAP (1/2) - Turn off immediately
  command: swapoff -a
  when: ansible_swaptotal_mb > 0

- name: Disable SWAP (2/2) - Remove from fstab (Permanent)
  ansible.posix.mount:
    name: "{{ item }}"
    fstype: swap
    state: absent
  loop:
    - swap
    - none

- name: Create /etc/modules-load.d/k8s.conf for persistence
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: Load Kernel Modules (overlay, br_netfilter)
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Configure Sysctl for K8s Networking
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/k8s.conf
    reload: yes
  loop:
    - { key: "net.bridge.bridge-nf-call-iptables", value: "1" }
    - { key: "net.ipv4.ip_forward", value: "1" }
    - { key: "net.bridge.bridge-nf-call-ip6tables", value: "1" }

# -----------------------------------------------------------------------
# 2. Containerd Installation (Official Docker Repo Method)
# -----------------------------------------------------------------------
- name: Install Dependencies for Docker Repo
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes

- name: Create Keyrings Directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker GPG Key
  get_url:
    # dynamically picks 'debian' or 'ubuntu' based on the OS
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker Repository
  copy:
    dest: /etc/apt/sources.list.d/docker.sources
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/{{ ansible_distribution | lower }}
      Suites: {{ ansible_distribution_release }}
      Components: stable
      Signed-By: /etc/apt/keyrings/docker.asc
  notify: Update Apt Cache

- name: Install Containerd.io (Official Package)
  apt:
    name: containerd.io
    state: present
    update_cache: yes

# -----------------------------------------------------------------------
# 3. Containerd Configuration (Judge -> Act Pattern)
# -----------------------------------------------------------------------
- name: Ensure /etc/containerd exists
  file:
    path: /etc/containerd
    state: directory

- name: Check if containerd config is valid (contains SystemdCgroup)
  ansible.builtin.command: grep "SystemdCgroup" /etc/containerd/config.toml
  register: containerd_config_check
  check_mode: no
  ignore_errors: yes
  changed_when: false

- name: Generate default containerd config (if stub or missing)
  ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
  when: containerd_config_check.rc != 0
  notify: Restart Containerd

- name: Set SystemdCgroup = true (Critical for K8s v1.24+)
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: Restart Containerd

- name: Ensure Containerd is started and enabled
  service:
    name: containerd
    state: started
    enabled: yes

- name: Configure crictl.yaml (For debugging)
  copy:
    dest: /etc/crictl.yaml
    content: |
      runtime-endpoint: unix:///run/containerd/containerd.sock
      image-endpoint: unix:///run/containerd/containerd.sock
      timeout: 10
      debug: false
    mode: '0644'

# -----------------------------------------------------------------------
# 4. Kubernetes Components Installation
# -----------------------------------------------------------------------
- name: Add Kubernetes Apt Key
  get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: '0644'

- name: Remove Legacy/Manual Kubernetes Repo Definition
  file:
    path: /etc/apt/sources.list.d/kubernetes.list
    state: absent

- name: Add Kubernetes Apt Repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/ /"
    state: present
    filename: kubernetes

- name: Install Kubelet, Kubeadm, Kubectl
  apt:
    name:
      - "kubelet={{ k8s_version }}.*"
      - "kubeadm={{ k8s_version }}.*"
      - "kubectl={{ k8s_version }}.*"
    state: present
    update_cache: yes

- name: Hold Kubernetes Packages
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: Install Kubeadm dependencies
  apt:
    name: conntrack
    state: present
    update_cache: yes
