---
- name: Disable SWAP (1/2) - Turn off immediately
  command: swapoff -a
  # prevent errors
  when: ansible_swaptotal_mb > 0

- name: Disable SWAP (2/2) - Remove from fstab (Permanent)
  ansible.posix.mount:
    name: "{{ item }}"
    fstype: swap
    state: absent
  loop:
    - swap
    - none

- name: Load Kernel Modules (overlay, br_netfilter)
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Configure Sysctl for K8s Networking
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/k8s.conf
    reload: yes
  loop:
    - { key: "net.bridge.bridge-nf-call-iptables", value: "1" }
    - { key: "net.ipv4.ip_forward", value: "1" }
    - { key: "net.bridge.bridge-nf-call-ip6tables", value: "1" }

- name: Install Containerd and Transport tools
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - containerd
    state: present
    update_cache: yes

- name: Generate default containerd config
  shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml

- name: Set SystemdCgroup = true (critical for v1.32+)
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: "SystemdCgroup = false"
    replace: "SystemdCgroup = true"
  notify: Restart Containerd

- name: Add Kubernetes Apt Key
  get_url:
    url: https://pkgs.k8s.io/core:/stable:/v1.34/deb/Release.key
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: "0644"

- name: Remove Legacy/Manual Kubernetes Repo Definition
  file:
    path: /etc/apt/sources.list.d/kubernetes.list
    state: absent
- name: Add Kubernetes Apt Repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v1.34/deb/ /"
    state: present
    filename: kubernetes

- name: Install Kubelet, Kubeadm, Kubectl
  apt:
    name:
      - kubelet=1.34.*
      - kubeadm=1.34.*
      - kubectl=1.34.*
    state: present
    update_cache: yes

- name: Hold Kubernetes Packages
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
