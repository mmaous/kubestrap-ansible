---
- name: Pre pull Kubernetes CP images
  ansible.builtin.command: kubeadm config images pull
  changed_when: false

- name: Initialize Kubernetes Cluster
  ansible.builtin.command: >
    kubeadm init
    --pod-network-cidr=192.168.0.0/16
    --apiserver-advertise-address={{ ansible_default_ipv4.address }}
  register: kubeadm_init
  args:
    creates: /etc/kubernetes/admin.conf

- name: Create .kube directory for {{ ansible_user }}
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Copy admin.conf to user kube config
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600" # Important for security!

# Apply Cilium CNI manifest
- name: Apply Cilium manifest from URL
  ansible.builtin.command: >
    kubectl apply -f https://raw.githubusercontent.com/cilium/cilium/v{{ cilium_version }}/install/kubernetes/quick-install.yaml
  environment:
    KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
  register: cilium_apply
  changed_when: "'created' in cilium_apply.stdout or 'configured' in cilium_apply.stdout"
