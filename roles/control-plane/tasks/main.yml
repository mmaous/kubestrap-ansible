---
- name: Pre pull Kubernetes CP images
  ansible.builtin.command: kubeadm config images pull
  changed_when: false

- name: Initialize Kubernetes Cluster
  ansible.builtin.command: >
    kubeadm init
    --pod-network-cidr=192.168.0.0/16
    --apiserver-advertise-address={{ ansible_default_ipv4.address }}
  register: kubeadm_init
  args:
    creates: /etc/kubernetes/admin.conf

- name: Create .kube directory for {{ ansible_user }}
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Copy admin.conf to user kube config
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600" # Important for security!

- name: Install Helm (Required for modern Cilium installation)
  ansible.builtin.shell: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm

- name: Add Cilium Helm repository
  ansible.builtin.command: helm repo add cilium https://helm.cilium.io/
  changed_when: false

- name: Apply Cilium CNI via Helm
  ansible.builtin.command: >
    helm upgrade --install cilium cilium/cilium
    --version {{ cilium_version }}
    --namespace kube-system
  environment:
    KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
  register: cilium_apply
  changed_when: "'Release \"cilium\" does not exist' in cilium_apply.stdout"
